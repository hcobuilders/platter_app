name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # No live database is needed here — `prisma generate` only reads the
      # schema file, and every route in this app is server-rendered on
      # demand (no static generation touches the DB at build time). These
      # are placeholder values so the build doesn't fail on missing env.
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder?schema=public"
          AUTH_SECRET: "ci-placeholder-secret-not-for-real-use"
